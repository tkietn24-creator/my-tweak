name: Build iOS Tweak (Theos)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (arm64)
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        run: |
          set -e
          echo "Cloning Theos (fast depth 1)..."
          git clone --depth=1 --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          echo "Preparing SDKs..."
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Tweak Package
        env:
          THEOS: /Users/runner/theos
        run: |
          set -e
          make clean
          make package FINALPACKAGE=1

      - name: Collect Output
        if: always()
        run: |
          mkdir -p output
          find packages -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true
          find .theos/obj -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Output files ==="
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReimanPrime-Tweak-Build
          path: output/*
          if-no-files-found: warn
